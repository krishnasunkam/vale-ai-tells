name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the style
        run: zip -r AiTells.zip AiTells
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" AiTells.zip --clobber || gh release create "${GITHUB_REF_NAME}" AiTells.zip --generate-notes
